const [bx,by]=D.btn, [ex,ey]=D.edge;
// C geometry for the draw-on sweep
const cb=$("C").getBBox(), ccx=cb.x+cb.width/2, ccy=cb.y+cb.height/2, cr=Math.max(cb.width,cb.height)*0.36;
const a0=-6*Math.PI/180, a1=6*Math.PI/180;
$("csweep").setAttribute("d",`M${ccx+cr*Math.cos(a0)} ${ccy+cr*Math.sin(a0)}A${cr} ${cr} 0 1 0 ${ccx+cr*Math.cos(a1)} ${ccy+cr*Math.sin(a1)}`);
$("csweep").setAttribute("stroke-width",cb.width*0.62);
const wb=document.querySelector("#place").getBBox();
const markC=[ccx, (cb.y+by)/2];             // centre of the capped C, logo units
const wordC=[wb.x+wb.width/2, wb.y+wb.height/2];
const tagW=[...document.querySelectorAll("#tag .w")], ctaW=[...document.querySelectorAll("#cta .w")];
const letters={m:4.0,i:4.08,o:4.2,l:4.28,e:4.36};

function render(t){
  // ---- cap: unfold level, tip, fall into a still frame, settle
  const drop=-80;
  let dy = t<2.2? drop : t<3.0? lerp(drop,0,inq(seg(t,2.2,3.0))) : 2.2*Math.sin(Math.PI*seg(t,3.0,3.3));
  const rot = 18*(1-io(seg(t,2.0,2.8)));
  $("cap").setAttribute("transform",`translate(0 ${dy}) rotate(${rot} ${bx} ${by})`);
  $("btn").setAttribute("transform",`translate(${bx} ${by}) scale(${back(seg(t,0.05,0.65))}) translate(${-bx} ${-by})`);
  // opening hook: one mango ripple out of the dot
  const rp=seg(t,0.15,1.0);
  $("ring").setAttribute("r", 9 + 46*out(rp)); $("ring").style.opacity = rp>0 && rp<1 ? 0.55*(1-rp) : 0;
  $("ring").setAttribute("cy", by+dy);
  $("cord1").style.strokeDasharray="1 1"; $("cord1").style.strokeDashoffset=1-out(seg(t,1.0,1.4));
  const lvl=(id,k)=>$(id).setAttribute("transform",`rotate(-18 ${bx} ${by}) translate(0 ${by}) scale(1 ${Math.max(k,0.0001)}) translate(0 ${-by}) rotate(18 ${bx} ${by})`);
  const sy=out(seg(t,1.3,2.0)); lvl("boardg",sy); $("boardg").style.opacity=sy>0?1:0;
  const bk=out(seg(t,1.95,2.35)); lvl("bandg",bk); $("bandg").style.opacity=bk>0?1:0;   // band unfolds, no grey fade
  // tassel: grows down as the cap tips, then swings twice and settles
  const grow=out(seg(t,2.0,2.6)); const k=t-3.0;
  const sw = t<3.0? -8*grow : Math.exp(-2.6*k)*(30*Math.sin(8.2*k) - 8*Math.cos(8.2*k));
  $("tassel").setAttribute("transform",`rotate(${sw} ${ex} ${ey}) translate(${ex} ${ey}) scale(1 ${Math.max(grow,0.0001)}) translate(${-ex} ${-ey})`);
  $("tassel").style.opacity=grow>0?1:0;
  // ---- C draws itself under the falling cap
  $("csweep").style.strokeDashoffset=1-io(seg(t,2.2,3.0));
  $("Cg").style.opacity = t<2.2?0:1;
  if(t>=3.0) $("Cg").removeAttribute("mask"); else $("Cg").setAttribute("mask","url(#cmask)");
  // ---- the rest of the word rises in, only once the camera is back at full frame
  for(const [id,st] of Object.entries(letters)){const p=out(seg(t,st,st+0.45));
    $(id).style.opacity=clamp(p*2.2); $(id).setAttribute("transform",`translate(0 ${32*(1-p)})`);}
  // ---- tagline, then a clean handover to the CTA (no overlap)
  const leave=io(seg(t,7.0,7.35));
  tagW.forEach((w,i)=>{const p=out(seg(t,4.9+i*0.12,4.9+i*0.12+0.4));
    w.style.opacity=p*(1-leave); w.style.transform=`translateY(${(1-p)*40-leave*60}px)`;});
  ctaW.forEach((w,i)=>{const p=out(seg(t,7.4+i*0.14,7.4+i*0.14+0.45));
    w.style.opacity=p; w.style.transform=`translateY(${(1-p)*44}px)`;});
  // ---- camera: dot, then settle on the C BEFORE the fall, hold still while it lands, pull back, slow push
  const btnNow=[bx, by+dy];
  let f, z;
  if(t<1.8){ f=btnNow; z=lerp(2.9,2.6,seg(t,0,1.8)); }
  else if(t<3.3){ const k2=io(seg(t,1.8,2.2)); const b0=[bx,by+drop]; f=[lerp(b0[0],markC[0],k2), lerp(b0[1],markC[1]+drop*0.35,k2)]; z=lerp(2.6,1.95,io(seg(t,1.8,2.2)))-0.05*seg(t,2.2,3.3); }
  else { const k3=io(seg(t,3.3,4.0)); const m0=[markC[0],markC[1]+drop*0.35]; f=[lerp(m0[0],wordC[0],k3), lerp(m0[1],wordC[1],k3)]; z=lerp(1.9,1.0,k3)+0.04*seg(t,4.0,10.5); }
  const [fx,fy]=L(...f);
  const ty = t<3.3? LY_.cy0 : lerp(LY_.cy0,LY_.cy,io(seg(t,3.3,4.0)));
  $("stage").style.transform=`translate(${LY_.W/2}px,${ty}px) scale(${z}) translate(${-fx}px,${-fy}px)`;
}
window.render=render; render(0);
</script></body></html>
