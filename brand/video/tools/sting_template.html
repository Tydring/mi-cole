<!doctype html><html lang="es"><head><meta charset="utf-8"><title>miCole sting</title>
<style>
@font-face{font-family:"Brico";src:url("bricolage700.ttf") format("truetype");font-weight:700}
:root{--paper:#F5EFE3;--ink:#17363A;--mango:#E59A2F}
html,body{margin:0;background:var(--paper)}
#frame{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--paper)}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
svg{position:absolute;left:0;top:0}
.ink{fill:var(--ink)}.gap{stroke:var(--paper)}.acc{fill:var(--mango)}.acc-s{stroke:var(--mango)}
.lines{position:absolute;left:0;width:1080px;font-family:"Brico";font-weight:700;color:var(--ink);text-align:center;letter-spacing:-0.01em}
.line{display:flex;justify-content:center;gap:0.26em;white-space:nowrap}
.w{display:inline-block;opacity:0;will-change:transform}
#tag{top:1110px;font-size:66px;line-height:1.18}
#cta{top:1110px;font-size:60px;line-height:1.2}
#cta .wa{font-size:0.62em;margin-top:22px;opacity:.9}
#cta .pill{display:inline-block;background:var(--mango);color:var(--ink);border-radius:999px;padding:16px 40px;font-size:50px;margin-top:26px}
</style></head><body>
<div id="frame"><div id="stage">
<svg id="sv" width="1080" height="1920" viewBox="0 0 1080 1920">
 <defs><mask id="cmask" maskUnits="userSpaceOnUse" x="-2000" y="-2000" width="5000" height="5000">
   <path id="csweep" fill="none" stroke="#fff" pathLength="1" stroke-dasharray="1 1"/></mask></defs>
 <g id="place">/*LOGO*/</g>
</svg>
<div class="lines" id="tag"><div class="line"><span class="w">Lo</span><span class="w">que</span><span class="w">pasa</span><span class="w">en</span><span class="w">el</span><span class="w">aula,</span></div>
<div class="line"><span class="w">llega</span><span class="w">a</span><span class="w">la</span><span class="w">casa.</span></div></div>
<div class="lines" id="cta"><div class="line"><span class="w">Muy</span><span class="w">pronto.</span></div>
<div class="line"><span class="w pill">Agenda una conversación</span></div>
<div class="line wa"><span class="w">WhatsApp +58 424 279 9280</span></div></div>
</div></div>
<script>
const D=/*DATA*/;
// frame layouts: ?r=9x16 (default), 16x9, 1x1
const LAYOUTS={"9x16":{W:1080,H:1920,lw:860,cy:880,cy0:960,top:1110,tf:66,cf:60},
               "16x9":{W:1920,H:1080,lw:820,cy:400,cy0:540,top:610,tf:58,cf:54},
               "1x1":{W:1080,H:1080,lw:760,cy:400,cy0:540,top:595,tf:56,cf:52}};
const LY_=LAYOUTS[new URLSearchParams(location.search).get("r")||"9x16"];
for(const id of ["frame","stage"]){const e=document.getElementById(id);e.style.width=LY_.W+"px";e.style.height=LY_.H+"px";}
document.getElementById("sv").setAttribute("width",LY_.W);document.getElementById("sv").setAttribute("height",LY_.H);
document.getElementById("sv").setAttribute("viewBox",`0 0 ${LY_.W} ${LY_.H}`);
for(const id of ["tag","cta"]){const e=document.getElementById(id);e.style.width=LY_.W+"px";e.style.top=LY_.top+"px";e.style.fontSize=(id=="tag"?LY_.tf:LY_.cf)+"px";}
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;      // ease in-out cubic
const out=x=>1-Math.pow(1-x,3);                         // ease out cubic
const inq=x=>x*x;                                       // ease in (gravity)
const back=x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}; // gentle overshoot
const lerp=(a,b,k)=>a+(b-a)*k;
// place the wordmark: 860 px wide, centered at (540, 900)
const [vx,vy,vw,vh]=D.vb, S=LY_.lw/vw, LX=LY_.W/2-S*(vx+vw/2), LY=LY_.cy-S*(vy+vh/2);
$("place").setAttribute("transform",`translate(${LX} ${LY}) scale(${S})`);
const L=(x,y)=>[LX+S*x,LY+S*y];
const [bx,by]=D.btn, [ex,ey]=D.edge;
// C geometry for the draw-on sweep
const cb=$("C").getBBox(), ccx=cb.x+cb.width/2, ccy=cb.y+cb.height/2, cr=Math.max(cb.width,cb.height)*0.36;
const a0=-6*Math.PI/180, a1=6*Math.PI/180;
$("csweep").setAttribute("d",`M${ccx+cr*Math.cos(a0)} ${ccy+cr*Math.sin(a0)}A${cr} ${cr} 0 1 0 ${ccx+cr*Math.cos(a1)} ${ccy+cr*Math.sin(a1)}`);
$("csweep").setAttribute("stroke-width",cb.width*0.62);
const wb=document.querySelector("#place").getBBox();
const markC=[ccx, (cb.y+by)/2];             // centre of the capped C, logo units
const wordC=[wb.x+wb.width/2, wb.y+wb.height/2];
const tagW=[...document.querySelectorAll("#tag .w")], ctaW=[...document.querySelectorAll("#cta .w")];
const letters={m:4.0,i:4.08,o:4.2,l:4.28,e:4.36};

function render(t){
  // ---- cap: unfold level, tip, fall into a still frame, settle
  const drop=-80;
  let dy = t<2.2? drop : t<3.0? lerp(drop,0,inq(seg(t,2.2,3.0))) : 2.2*Math.sin(Math.PI*seg(t,3.0,3.3));
  const rot = 18*(1-io(seg(t,2.0,2.8)));
  $("cap").setAttribute("transform",`translate(0 ${dy}) rotate(${rot} ${bx} ${by})`);
  $("btn").setAttribute("transform",`translate(${bx} ${by}) scale(${back(seg(t,0.05,0.65))}) translate(${-bx} ${-by})`);
  // opening hook: one mango ripple out of the dot
  const rp=seg(t,0.15,1.0);
  $("ring").setAttribute("r", 9 + 46*out(rp)); $("ring").style.opacity = rp>0 && rp<1 ? 0.55*(1-rp) : 0;
  $("ring").setAttribute("cy", by+dy);
  $("cord1").style.strokeDasharray="1 1"; $("cord1").style.strokeDashoffset=1-out(seg(t,1.0,1.4));
  const lvl=(id,k)=>$(id).setAttribute("transform",`rotate(-18 ${bx} ${by}) translate(0 ${by}) scale(1 ${Math.max(k,0.0001)}) translate(0 ${-by}) rotate(18 ${bx} ${by})`);
  const sy=out(seg(t,1.3,2.0)); lvl("boardg",sy); $("boardg").style.opacity=sy>0?1:0;
  const bk=out(seg(t,1.95,2.35)); lvl("bandg",bk); $("bandg").style.opacity=bk>0?1:0;   // band unfolds, no grey fade
  // tassel: grows down as the cap tips, then swings twice and settles
  const grow=out(seg(t,2.0,2.6)); const k=t-3.0;
  const sw = t<3.0? -8*grow : Math.exp(-2.6*k)*(30*Math.sin(8.2*k) - 8*Math.cos(8.2*k));
  $("tassel").setAttribute("transform",`rotate(${sw} ${ex} ${ey}) translate(${ex} ${ey}) scale(1 ${Math.max(grow,0.0001)}) translate(${-ex} ${-ey})`);
  $("tassel").style.opacity=grow>0?1:0;
  // ---- C draws itself under the falling cap
  $("csweep").style.strokeDashoffset=1-io(seg(t,2.2,3.0));
  $("Cg").style.opacity = t<2.2?0:1;
  if(t>=3.0) $("Cg").removeAttribute("mask"); else $("Cg").setAttribute("mask","url(#cmask)");
  // ---- the rest of the word rises in, only once the camera is back at full frame
  for(const [id,st] of Object.entries(letters)){const p=out(seg(t,st,st+0.45));
    $(id).style.opacity=clamp(p*2.2); $(id).setAttribute("transform",`translate(0 ${32*(1-p)})`);}
  // ---- tagline, then a clean handover to the CTA (no overlap)
  const leave=io(seg(t,7.0,7.35));
  tagW.forEach((w,i)=>{const p=out(seg(t,4.9+i*0.12,4.9+i*0.12+0.4));
    w.style.opacity=p*(1-leave); w.style.transform=`translateY(${(1-p)*40-leave*60}px)`;});
  ctaW.forEach((w,i)=>{const p=out(seg(t,7.4+i*0.14,7.4+i*0.14+0.45));
    w.style.opacity=p; w.style.transform=`translateY(${(1-p)*44}px)`;});
  // ---- camera: dot, then settle on the C BEFORE the fall, hold still while it lands, pull back, slow push
  const btnNow=[bx, by+dy];
  let f, z;
  if(t<1.8){ f=btnNow; z=lerp(2.9,2.6,seg(t,0,1.8)); }
  else if(t<3.3){ const k2=io(seg(t,1.8,2.2)); const b0=[bx,by+drop]; f=[lerp(b0[0],markC[0],k2), lerp(b0[1],markC[1]+drop*0.35,k2)]; z=lerp(2.6,1.95,io(seg(t,1.8,2.2)))-0.05*seg(t,2.2,3.3); }
  else { const k3=io(seg(t,3.3,4.0)); const m0=[markC[0],markC[1]+drop*0.35]; f=[lerp(m0[0],wordC[0],k3), lerp(m0[1],wordC[1],k3)]; z=lerp(1.9,1.0,k3)+0.04*seg(t,4.0,10.5); }
  const [fx,fy]=L(...f);
  const ty = t<3.3? LY_.cy0 : lerp(LY_.cy0,LY_.cy,io(seg(t,3.3,4.0)));
  $("stage").style.transform=`translate(${LY_.W/2}px,${ty}px) scale(${z}) translate(${-fx}px,${-fy}px)`;
}
window.render=render; render(0);
</script></body></html>
